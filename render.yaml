# Render Blueprint — GitHub 저장소를 연결하면 웹 서비스 + PostgreSQL 이 한 번에 만들어집니다 (ADR-019).
# 사용법: docs/DEPLOY.md 참고. 요금·플랜 이름은 Render 요금표에서 최신 정보를 확인하세요.
services:
  - type: web
    name: kgb-agent
    runtime: node
    # free 플랜은 일정 시간 미사용 시 잠들었다가 첫 접속 때 깨어납니다(수십 초 지연).
    plan: free
    region: singapore
    # pnpm 버전을 고정해 설치(corepack 설정과 무관하게 동작)
    buildCommand: npx --yes pnpm@10.28.0 install --frozen-lockfile && npm run build
    # 시작 시: DB 마이그레이션 적용 → 기본 구조·초기 관리자 보장(멱등) → 서버 실행
    startCommand: npm run db:migrate && npm run admin:ensure && npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: kgb-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true
      # AI: anthropic 으로 두면 ANTHROPIC_API_KEY 를 넣는 순간 켜지고, 비워 두면 자동으로 꺼진 채(수동 기능만) 동작
      - key: AI_PROVIDER
        value: anthropic
      # AI 키 — Render 화면에서만 입력(저장소에 절대 커밋 금지, 화면에서 가려져 표시됨). 처음엔 비워 둬도 됩니다.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WORKER_MODE
        value: inline
      - key: STORAGE_DRIVER
        value: db
      - key: UPLOAD_MAX_MB
        value: "50"
      # 처음 배포할 때 대시보드에서 직접 입력 (저장소에 커밋하지 않음)
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      # 체험용 가상 데이터(가상 회원 11명·연락처·사업 2개·회의록 2건)를 처음 한 번만 넣음
      - key: SEED_DEMO
        value: "true"
      # 데모 계정(예: promotion.member@demo.kgb.invalid)으로 로그인해 국원 화면을 보려면 비밀번호 입력(10자 이상, 선택)
      - key: SEED_DEMO_PASSWORD
        sync: false

databases:
  - name: kgb-db
    databaseName: kgb
    user: kgb
    region: singapore
    postgresMajorVersion: "16"
    # free 플랜 DB 는 보존 기간 제한이 있어 데이터가 삭제될 수 있습니다. 계속 쓸 데이터라면 유료 플랜으로 바꾸세요.
    plan: free
